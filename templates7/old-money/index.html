<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=La+Belle+Aurore&family=Cormorant:ital,wght@0,400;0,500;1,400&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<script>
/* =========================================================================
   EDIT ONLY THIS BLOCK FOR EACH CLIENT
   ========================================================================= */
const CONFIG = {
  bride: "Emma",
  groom: "James",
  dateISO: "2027-06-12T15:00:00",
  endISO: "2027-06-12T23:30:00",
  time: "3:00 PM",
  venue: "Villa Serbelloni",
  address: "Via Roma 1, 22021 Bellagio, Italy",
  city: "Lake Como, Italy",
  story: [
    ["2019", "We met", "A rainy Tuesday, a tiny bookshop, the same book."],
    ["2023", "First home", "Two cities became one apartment (and one dog)."],
    ["2026", "She said yes", "Sunset, a lake, and a very nervous question."],
    ["2027", "Forever", "And now — we'd love you there."]
  ],
  schedule: [["3:00 PM","Ceremony"],["4:00 PM","Cocktail hour"],["6:00 PM","Dinner"],["8:00 PM","First dance & party"]],
  dressCode: "Garden formal",
  rsvpDeadline: "May 1, 2027",
  meals: ["Beef", "Fish", "Vegetarian"],
  maxGuests: 4,
  hashtag: "#EmmaAndJames2027",
  music: "music.mp3",
  rsvpUrl: "",
  photos: { top: "photos/top.jpg", story: "photos/story.jpg" }
};
</script>
<style>
  :root{
    --bg:#efebe4; --paper:#fffdf9; --ink:#1e1e1e; --muted:#7b766f; --accent:#9b2f2f; --ink-circle:#9b2f2f; --line:#e4ded3; --btn-ink:#fff;
    --photo:none; --display:"Marcellus",serif; --hand:"La Belle Aurore",cursive; --serif:"Cormorant",Georgia,serif; --sans:"Nunito Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body.locked{overflow:hidden}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px}
  .lbl{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .hand{font-family:var(--hand);font-weight:400;line-height:1.1;color:var(--accent)}
  h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,42px);letter-spacing:.06em;text-transform:uppercase;line-height:1.1;margin:6px 0 24px}
  section{padding:76px 0;text-align:center}
  .ph{background-size:cover;background-position:center;filter:var(--photo)}
  .rv{opacity:0;transform:translate3d(0,22px,0);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
  .rv.in{opacity:1;transform:none}
  .hide{display:none!important}

  /* ================= CALENDAR CARD ================= */
  .stage{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 16px 40px;perspective:1600px}
  .cal{position:relative;width:min(88vw,380px);background:var(--paper);box-shadow:0 30px 60px rgba(0,0,0,.14),0 2px 0 var(--line);border-radius:4px}
  .rings{position:absolute;top:-12px;left:0;right:0;display:flex;justify-content:space-around;padding:0 22%;z-index:6}
  .rings i{width:10px;height:26px;border-radius:6px;background:linear-gradient(90deg,#9a9a9a,#eee 45%,#8a8a8a);box-shadow:0 2px 3px rgba(0,0,0,.3)}
  .cal .photo{height:min(52vw,230px);border-radius:4px 4px 0 0}
  .pagewrap{position:relative;height:330px}
  .page{position:absolute;inset:0;background:var(--paper);padding:20px 22px 18px;transform-origin:50% 0;backface-visibility:hidden;will-change:transform,opacity}
  .page.flip{animation:flip .55s cubic-bezier(.5,0,.6,1) forwards}
  @keyframes flip{0%{transform:rotateX(0)}100%{transform:rotateX(-110deg);opacity:0}}
  .mh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
  .mh b{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.1em;text-transform:uppercase}
  .mh span{font-family:var(--display);font-size:18px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;font-size:15px;text-align:center}
  .grid em{font-style:normal;font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:600;padding-bottom:4px}
  .grid span{height:36px;display:flex;align-items:center;justify-content:center;position:relative}
  .grid span.wd{font-weight:600}
  .circle{position:absolute;left:50%;top:50%;width:52px;height:46px;transform:translate(-50%,-50%) rotate(-8deg);pointer-events:none;overflow:visible}
  .circle path{fill:none;stroke:var(--ink-circle);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:190;stroke-dashoffset:190}
  .drawn .circle path{transition:stroke-dashoffset 1.1s cubic-bezier(.6,0,.3,1)}
  .drawn.circled .circle path{stroke-dashoffset:0}
  .heart{position:absolute;right:-8px;top:-10px;width:16px;height:16px;fill:var(--ink-circle);opacity:0;transform:scale(.3) rotate(-15deg);transition:all .5s cubic-bezier(.3,1.6,.5,1) 1s}
  .circled .heart{opacity:1;transform:scale(1) rotate(-15deg)}
  .std{margin-top:14px;text-align:center}
  .std .hand{font-size:clamp(40px,11vw,52px);display:inline-block;clip-path:inset(0 100% 0 0);transition:clip-path 1.6s cubic-bezier(.5,0,.3,1) 1.2s}
  .circled ~ .std .hand,.std.go .hand{clip-path:inset(0 0 0 0)}
  .names{font-family:var(--display);font-size:clamp(28px,8vw,38px);letter-spacing:.12em;text-transform:uppercase;margin-top:22px;line-height:1.15}
  .names i{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;color:var(--accent)}
  .sub{color:var(--muted);margin-top:4px;letter-spacing:.06em}
  .tapnote{margin-top:22px;font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);animation:bl 2s ease-in-out infinite}
  @keyframes bl{50%{opacity:.35}}
  .after{opacity:0;transform:translateY(12px);transition:opacity .9s ease 2.2s,transform .9s ease 2.2s}
  .played .after{opacity:1;transform:none}
  .played .tapnote{display:none}
  .btn{display:inline-block;font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;padding:13px 22px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;background:none;cursor:pointer;border-radius:999px}
  .btn.solid{background:var(--accent);border-color:var(--accent);color:var(--btn-ink)}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}

  /* ================= FLIP COUNTDOWN ================= */
  .flipcd{display:flex;justify-content:center;gap:12px}
  .unit{display:flex;flex-direction:column;align-items:center;gap:8px}
  .digits{display:flex;gap:4px}
  .dg{position:relative;width:38px;height:54px;background:var(--ink);color:var(--paper);border-radius:6px;font-family:var(--display);font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,0,0,.15);overflow:hidden}
  .dg::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.4)}
  .dg.tick{animation:fl .45s ease}
  @keyframes fl{0%{transform:rotateX(0)}45%{transform:rotateX(90deg)}55%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
  .unit small{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:600}

  /* ================= STORY TIMELINE ================= */
  .storyph{width:100%;aspect-ratio:16/10;border-radius:4px;margin-bottom:34px}
  .tl{position:relative;text-align:left;max-width:420px;margin:0 auto}
  .tl::before{content:"";position:absolute;left:68px;top:6px;bottom:6px;width:1px;background:var(--line)}
  .st{display:grid;grid-template-columns:56px 1fr;gap:26px;padding:12px 0;position:relative}
  .st b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--accent);text-align:right}
  .st b::after{content:"";position:absolute;left:64px;top:21px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--accent)}
  .st h3{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.06em}
  .st p{color:var(--muted);font-size:15px}

  /* ================= DETAILS ================= */
  .card{background:var(--paper);border-radius:6px;padding:30px 22px;box-shadow:0 14px 30px rgba(0,0,0,.06)}
  .card .big{font-family:var(--display);font-size:28px;letter-spacing:.06em}
  .sched{margin-top:20px;text-align:left}
  .sched div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--line)}
  .sched div span:first-child{font-family:var(--display);color:var(--accent)}
  form{display:grid;gap:14px;text-align:left}
  .fl{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600}
  input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 2px;border-radius:0;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  select option{color:#111}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .two input{position:absolute;opacity:0;pointer-events:none}
  .two label{border:1px solid var(--line);border-radius:999px;text-align:center;padding:12px 6px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
  .two input:checked+label{background:var(--accent);color:var(--btn-ink);border-color:var(--accent)}
  footer{padding:60px 0 90px;text-align:center}
  footer .hand{font-size:clamp(46px,12vw,64px)}
  #music{position:fixed;right:14px;bottom:14px;z-index:40;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.1)}
  #music svg{width:18px;fill:var(--accent)}
  /* ===== THEME ===== */
:root{--bg:#ece6da;--paper:#fbf8f1;--ink:#1f2a44;--muted:#6b7186;--accent:#b08d57;--ink-circle:#b08d57;--line:#e3dccd;--photo:sepia(.12) saturate(.85);--btn-ink:#fff}
</style>
</head>
<body>
<button id="music" aria-label="Music"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></button>
<audio id="audio" loop preload="none"></audio>

<header class="stage" id="stage">
  <div class="cal" id="cal">
    <div class="rings"><i></i><i></i></div>
    <div class="photo ph" id="topPh"></div>
    <div class="pagewrap" id="pages"></div>
  </div>
  <div class="std" id="std"><span class="hand">Save the date</span></div>
  <p class="tapnote" id="tap">Tap the calendar</p>
  <div class="after">
    <p class="names"><span data-k="bride"></span> <i>&amp;</i> <span data-k="groom"></span></p>
    <p class="sub" id="sub"></p>
    <div class="btns"><button class="btn" id="addCal">Add to calendar</button><a class="btn solid" href="#rsvp">RSVP</a></div>
  </div>
</header>

<main class="wrap">
  <section class="rv">
    <p class="lbl">Only</p>
    <div class="flipcd" style="margin:18px 0 10px">
      <div class="unit"><div class="digits" id="uD"></div><small>Days</small></div>
      <div class="unit"><div class="digits" id="uH"></div><small>Hours</small></div>
      <div class="unit"><div class="digits" id="uM"></div><small>Minutes</small></div>
    </div>
    <p class="lbl">to go</p>
  </section>

  <section class="rv">
    <p class="lbl">Our story</p><h2>How we got here</h2>
    <div class="storyph ph" id="storyPh"></div>
    <div class="tl" id="tl"></div>
  </section>

  <section class="rv">
    <p class="lbl">The details</p><h2>Where &amp; when</h2>
    <div class="card">
      <p class="big" data-k="venue"></p><p style="color:var(--muted)" data-k="address"></p>
      <p style="margin-top:10px" id="when"></p>
      <div class="btns"><a class="btn" id="mapBtn" target="_blank" rel="noopener">Directions</a></div>
      <div class="sched" id="sched"></div>
      <p class="lbl" style="margin-top:20px">Dress code · <span style="color:var(--ink)" data-k="dressCode"></span></p>
    </div>
  </section>

  <section class="rv" id="rsvp">
    <p class="lbl">Please reply by <span data-k="rsvpDeadline"></span></p><h2>RSVP</h2>
    <div class="card">
      <form id="f">
        <div><label class="fl">Name</label><input name="name" required autocomplete="name"></div>
        <div class="two"><input type="radio" name="attending" value="Yes" id="ay" required><label for="ay">Count me in</label><input type="radio" name="attending" value="No" id="an"><label for="an">Can't make it</label></div>
        <div class="yes"><label class="fl">Guests</label><select name="guests" id="guests"></select></div>
        <div class="yes"><label class="fl">Meal</label><select name="meal" id="meal"></select></div>
        <div><label class="fl">Note</label><textarea name="message" rows="2"></textarea></div>
        <button class="btn solid" id="send" style="justify-self:center">Send RSVP</button>
      </form>
      <p id="thx" class="hide" style="font-family:var(--display);font-size:22px"></p>
    </div>
  </section>
</main>
<footer><p class="hand" id="footN"></p><p class="lbl" data-k="hashtag"></p></footer>

<script>
(function(){
  const C = CONFIG, $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const d = new Date(C.dateISO), pad = n => String(n).padStart(2, "0");
  $$("[data-k]").forEach(el => el.textContent = C[el.dataset.k] ?? "");
  document.title = `${C.bride} & ${C.groom} — Save the Date`;
  $("#footN").textContent = `${C.bride} & ${C.groom}`;
  $("#sub").textContent = `${d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" })} · ${C.city}`;
  $("#when").textContent = `${d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" })} at ${C.time}`;
  $("#topPh").style.backgroundImage = `url("${C.photos.top}")`; $("#storyPh").style.backgroundImage = `url("${C.photos.story}")`;
  $("#mapBtn").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(C.venue + ", " + C.address);

  // calendar pages: 4 months before the wedding month flip away
  const CIRCLE = '<svg class="circle" viewBox="0 0 60 52"><path d="M31 4 C 14 3, 3 14, 5 28 C 7 42, 22 49, 36 46 C 50 43, 57 31, 54 19 C 51 8, 38 2, 24 6"/></svg><svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 4.4 2.5.8-1.3 2.3-2.5 4.4-2.5 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';
  function monthHTML(y, m, mark) {
    const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    let g = ["S","M","T","W","T","F","S"].map(x => `<em>${x}</em>`).join("") + "<span></span>".repeat(first);
    for (let i = 1; i <= days; i++) g += i === mark ? `<span class="wd">${i}${CIRCLE}</span>` : `<span>${i}</span>`;
    const name = new Date(y, m, 1).toLocaleDateString("en-US", { month: "long" });
    return `<div class="mh"><b>${name}</b><span>${y}</span></div><div class="grid">${g}</div>`;
  }
  const pagesEl = $("#pages"), N = 4;
  for (let k = 0; k <= N; k++) {
    const dt = new Date(d.getFullYear(), d.getMonth() - (N - k), 1);
    const el = document.createElement("div"); el.className = "page" + (k === N ? " drawn" : "");
    el.style.zIndex = 10 - k; el.innerHTML = monthHTML(dt.getFullYear(), dt.getMonth(), k === N ? d.getDate() : 0);
    pagesEl.appendChild(el);
  }
  const pages = $$(".page"), last = pages[N];
  let played = false;
  function play(fast) {
    if (played) return; played = true; $("#stage").classList.add("played");
    if (C.music && !fast) { $("#music").style.display = "flex"; audio.play().catch(() => {}); }
    const step = fast ? 0 : 380;
    pages.slice(0, N).forEach((p, i) => setTimeout(() => p.classList.add("flip"), 200 + i * step));
    setTimeout(() => { last.classList.add("circled"); $("#std").classList.add("go"); }, fast ? 0 : 200 + N * step + 300);
  }
  $("#cal").onclick = () => play(false);
  if (/[?&]open\b/.test(location.search)) { pages.slice(0, N).forEach(p => p.style.display = "none"); play(true); }
  if (/[?&]autoopen\b/.test(location.search)) setTimeout(() => play(false), 500);

  // add to calendar (.ics)
  $("#addCal").onclick = () => {
    const f = x => new Date(x).toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Invite//EN", "BEGIN:VEVENT", `UID:${Date.now()}@invite`, `DTSTAMP:${f(Date.now())}`,
      `DTSTART:${f(C.dateISO)}`, `DTEND:${f(C.endISO || C.dateISO)}`, `SUMMARY:${C.bride} & ${C.groom}'s Wedding`, `LOCATION:${C.venue}, ${C.address}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" })); a.download = "wedding.ics"; a.click();
  };

  // flip countdown
  const units = { uD: 3, uH: 2, uM: 2 };
  Object.entries(units).forEach(([id, n]) => $("#" + id).innerHTML = "<span class='dg'>0</span>".repeat(n));
  const setU = (id, val) => { const s = String(val).padStart(units[id], "0").slice(-units[id]);
    [...$("#" + id).children].forEach((el, i) => { if (el.textContent !== s[i]) { el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick"); setTimeout(() => el.textContent = s[i], 200); } }); };
  const tick = () => { let s = Math.max(0, Math.floor((d - Date.now()) / 1000)); setU("uD", Math.floor(s / 86400)); s %= 86400; setU("uH", Math.floor(s / 3600)); s %= 3600; setU("uM", Math.floor(s / 60)); };
  tick(); setInterval(tick, 10000);

  C.story.forEach(([y, h, p]) => $("#tl").insertAdjacentHTML("beforeend", `<div class="st"><b>${esc(y)}</b><div><h3>${esc(h)}</h3><p>${esc(p)}</p></div></div>`));
  C.schedule.forEach(([t, e]) => $("#sched").insertAdjacentHTML("beforeend", `<div><span>${esc(t)}</span><span>${esc(e)}</span></div>`));
  $("#guests").innerHTML = Array.from({ length: C.maxGuests }, (_, i) => `<option>${i + 1}</option>`).join("");
  $("#meal").innerHTML = C.meals.map(m => `<option>${esc(m)}</option>`).join("");
  $$('input[name="attending"]').forEach(r => r.onchange = () => $$(".yes").forEach(el => el.classList.toggle("hide", $("#an").checked)));
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
  $$(".rv").forEach(el => io.observe(el));

  const audio = $("#audio"), mb = $("#music"); if (C.music) audio.src = C.music;
  audio.onerror = () => mb.style.display = "none";
  mb.onclick = () => audio.paused ? audio.play().catch(() => {}) : audio.pause();

  $("#f").onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(e.target); $("#send").disabled = true; $("#send").textContent = "Sending…";
    try { if (C.rsvpUrl) await fetch(C.rsvpUrl, { method: "POST", mode: "no-cors", body: fd }); } catch (_) {}
    $("#thx").textContent = fd.get("attending") === "Yes" ? `Yay! See you on the big day, ${fd.get("name")}.` : `Thank you, ${fd.get("name")} — we'll miss you.`;
    e.target.classList.add("hide"); $("#thx").classList.remove("hide");
  };
})();
</script>
<script>/* hide music controls when the song file is missing */
(function(){var a=document.getElementById('audio');if(!a||!a.getAttribute('src'))return;var p=new Audio();p.preload='metadata';
p.onerror=function(){['music','mbtn','np'].forEach(function(id){var e=document.getElementById(id);if(e)e.style.setProperty('display','none','important');});};p.src=a.getAttribute('src');})();</script>
</body>
</html>
