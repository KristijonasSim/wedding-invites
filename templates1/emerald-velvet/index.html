<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Pinyon+Script&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<script>
/* =========================================================================
   EDIT ONLY THIS BLOCK FOR EACH CLIENT
   ========================================================================= */
const CONFIG = {
  bride: "Emma",
  groom: "James",
  dateISO: "2027-06-12T15:00:00",          // ceremony start (local time)
  dateText: "Saturday, June 12, 2027",
  city: "Lake Como, Italy",
  intro: "Together with their families",
  story: "We met on a rainy Tuesday in a tiny bookshop, both reaching for the same book. Seven years, two cities and one very patient dog later, we can't wait to celebrate the next chapter with the people we love most.",
  ceremony:  { title: "Ceremony",  time: "3:00 PM", place: "Villa Serbelloni Chapel", address: "Via Roma 1, 22021 Bellagio, Italy" },
  reception: { title: "Reception", time: "6:00 PM", place: "Villa Serbelloni Gardens", address: "Via Roma 1, 22021 Bellagio, Italy" },
  schedule: [
    ["3:00 PM", "Ceremony"],
    ["4:00 PM", "Cocktails & photos"],
    ["6:00 PM", "Dinner"],
    ["8:00 PM", "First dance & party"],
    ["11:30 PM", "Sparkler send-off"]
  ],
  dressCode: "Garden formal. Soft, light colours are warmly welcome.",
  palette: ["#0e3b2e", "#1d5c48", "#c9a96a", "#efe4cf", "#f8f3e8"],
  photos: ["photo1.jpg", "photo2.jpg", "photo3.jpg", "photo4.jpg"],
  rsvpDeadline: "May 1, 2027",
  meals: ["Beef", "Fish", "Vegetarian"],
  maxGuests: 4,
  hashtag: "#EmmaAndJamesSayIDo",
  music: "music.mp3",                        // put the song file next to this page
  rsvpUrl: ""                                // Google Apps Script web app URL (see rsvp-google-sheet.gs)
};
</script>
<style>
  :root{
    --bg:#faf7f2; --paper:#fffdf9; --ink:#2f2a26; --muted:#7b7068;
    --accent:#a88b5c; --accent-soft:#e9dccb; --line:#e6ddd0;
    --script:"Pinyon Script", cursive; --serif:"Cormorant Garamond", Georgia, serif; --sans:"Jost", system-ui, sans-serif;
    --ink-soft:#4a423c; --btn-ink:#fff;
    --cover-bg:radial-gradient(circle at 50% 30%,#fffdf9 0%,#f1e9dd 70%);
    --hero-bg:radial-gradient(ellipse at top,rgba(233,220,203,.65),transparent 60%),radial-gradient(ellipse at bottom,rgba(156,175,136,.18),transparent 60%),#faf7f2;
    --seal:radial-gradient(circle at 35% 30%,#c9a877,#8d6c3f); --seal-ink:#fff8ec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body.locked{overflow:hidden}
  img{max-width:100%;display:block}
  .wrap{max-width:760px;margin:0 auto;padding:0 22px}
  section{padding:88px 0;text-align:center}
  .eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
  h2{font-family:var(--script);font-weight:400;font-size:clamp(44px,9vw,64px);line-height:1.1;margin:10px 0 22px;color:var(--ink)}
  .divider{width:70px;height:1px;background:var(--accent);margin:26px auto;opacity:.7}
  .fade{opacity:0;transform:translateY(24px);transition:opacity 1s ease, transform 1s ease}
  .fade.in{opacity:1;transform:none}

  /* ---------- Envelope / opening screen ---------- */
  #cover{position:fixed;inset:0;z-index:50;background:var(--cover-bg);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;transition:opacity 1.1s ease, visibility 1.1s}
  #cover.gone{opacity:0;visibility:hidden}
  .seal{width:120px;height:120px;border-radius:50%;background:var(--seal);box-shadow:0 10px 30px rgba(120,90,50,.35), inset 0 -6px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;color:var(--seal-ink);font-family:var(--script);font-size:44px;margin:28px 0}
  #cover .names-sm{font-family:var(--serif);font-size:22px;letter-spacing:.12em;text-transform:uppercase}
  .btn{display:inline-block;font-family:var(--sans);font-size:13px;letter-spacing:.24em;text-transform:uppercase;padding:15px 34px;border:1px solid var(--accent);color:var(--ink);background:transparent;cursor:pointer;transition:background .3s,color .3s;text-decoration:none;border-radius:999px}
  .btn:hover,.btn.solid{background:var(--accent);color:var(--btn-ink)}
  .btn.solid:hover{filter:brightness(.9)}

  /* ---------- Music toggle ---------- */
  #music{position:fixed;right:16px;bottom:16px;z-index:40;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,253,249,.92);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  #music svg{width:20px;height:20px;fill:var(--accent)}
  #music.playing svg{animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Hero ---------- */
  #hero{min-height:100svh;display:flex;align-items:center;justify-content:center;position:relative;padding:60px 0;overflow:hidden;background:var(--hero-bg)}
  #hero .wrap{position:relative;z-index:2}
  .frame{position:absolute;inset:18px;border:1px solid var(--line);pointer-events:none}
  .frame::after{content:"";position:absolute;inset:8px;border:1px solid var(--line)}
  .hero-names{font-family:var(--script);font-size:clamp(64px,16vw,124px);line-height:1;margin:22px 0 6px;font-weight:400}
  .amp{display:block;font-size:.5em;color:var(--accent);margin:4px 0}
  .hero-date{font-family:var(--serif);font-size:clamp(20px,4.5vw,26px);letter-spacing:.14em;text-transform:uppercase;margin-top:18px}
  .hero-city{font-style:italic;color:var(--muted);margin-top:4px}
  .scroll{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
  .scroll::after{content:"";display:block;width:1px;height:34px;background:var(--accent);margin:10px auto 0;animation:drop 2s ease-in-out infinite}
  @keyframes drop{0%,100%{transform:scaleY(.3);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}

  /* ---------- Countdown ---------- */
  .count{display:flex;justify-content:center;gap:clamp(10px,4vw,34px);margin-top:10px}
  .count div{min-width:70px}
  .count b{display:block;font-family:var(--serif);font-weight:300;font-size:clamp(40px,10vw,64px);line-height:1}
  .count span{font-family:var(--sans);font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}

  /* ---------- Story ---------- */
  #story{background:var(--paper)}
  .story-img{width:min(320px,80%);aspect-ratio:3/4;margin:0 auto 34px;border-radius:200px 200px 6px 6px;overflow:hidden;box-shadow:0 18px 40px rgba(80,60,40,.12)}
  .story-img img,.ph{width:100%;height:100%;object-fit:cover}
  .ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent-soft),var(--accent));color:var(--btn-ink);font-family:var(--script);font-size:56px}
  .story-text{max-width:560px;margin:0 auto;font-size:21px;font-style:italic;color:var(--ink-soft)}

  /* ---------- Details ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:10px}
  .card{background:var(--paper);border:1px solid var(--line);padding:36px 26px;border-radius:4px}
  .card h3{font-family:var(--sans);font-weight:400;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
  .card .time{font-size:34px;font-weight:300;margin:10px 0 4px}
  .card .place{font-size:21px;font-weight:500}
  .card .addr{color:var(--muted);font-size:17px;margin:4px 0 20px}
  .card .btn{padding:11px 22px;font-size:11px}

  /* ---------- Schedule ---------- */
  #schedule{background:var(--paper)}
  .timeline{max-width:420px;margin:0 auto;text-align:left;position:relative}
  .timeline::before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:1px;background:var(--line)}
  .tl{display:flex;gap:28px;align-items:baseline;padding:13px 0;position:relative}
  .tl .t{width:76px;text-align:right;font-family:var(--sans);font-size:14px;color:var(--accent);letter-spacing:.05em;flex:none}
  .tl .t::after{content:"";position:absolute;left:92px;top:22px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--accent)}
  .tl .e{font-size:21px}

  /* ---------- Dress code ---------- */
  .swatches{display:flex;justify-content:center;gap:12px;margin-top:22px}
  .swatches i{width:38px;height:38px;border-radius:50%;border:1px solid rgba(0,0,0,.06);box-shadow:0 3px 10px rgba(0,0,0,.06)}

  /* ---------- Gallery ---------- */
  #gallery{background:var(--paper)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid .g{aspect-ratio:4/5;overflow:hidden;border-radius:4px}
  .grid .g:nth-child(3n+1){grid-column:span 2;aspect-ratio:16/10}
  .grid img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
  .grid .g:hover img{transform:scale(1.04)}

  /* ---------- RSVP ---------- */
  form{max-width:480px;margin:10px auto 0;text-align:left;display:grid;gap:18px}
  label{font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
  input,select,textarea{width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px;outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .choice label{margin:0;text-align:center;padding:14px 8px;border:1px solid var(--line);border-radius:4px;background:var(--paper);cursor:pointer;color:var(--ink);font-size:12px;transition:all .2s}
  .choice input:checked + label{background:var(--accent);border-color:var(--accent);color:var(--btn-ink)}
  .hide{display:none}
  .thanks{padding:30px 0}
  .thanks h3{font-family:var(--script);font-weight:400;font-size:52px}

  footer{padding:70px 0 90px;text-align:center}
  footer .hero-names{font-size:clamp(48px,12vw,72px)}
  footer .tag{font-family:var(--sans);letter-spacing:.2em;font-size:13px;color:var(--accent);margin-top:10px}
  /* ===== THEME ===== */

  :root{--bg:#0e3b2e;--paper:#124636;--ink:#f3ead8;--muted:#b9c2b0;--accent:#d2b57a;--accent-soft:#2c5a46;--line:#245542;--ink-soft:#e3d8c2;--btn-ink:#0e3b2e;
    --cover-bg:radial-gradient(circle at 50% 30%,#175a45,#0a2c22 80%);
    --hero-bg:radial-gradient(ellipse at center,#165440 0%,#0a2c22 80%);
    --seal:radial-gradient(circle at 35% 30%,#e8cf98,#a8843f);--seal-ink:#0e3b2e}
  .eyebrow,.card h3{font-family:"Cormorant SC",serif;font-size:15px;letter-spacing:.28em}
  .frame{border-color:rgba(210,181,122,.5)}.frame::after{border-color:rgba(210,181,122,.25)}
  .orn{position:absolute;top:9%;left:50%;transform:translateX(-50%);width:min(70vw,280px);color:var(--accent);z-index:2}
</style>
</head>
<body class="locked">

<!-- Opening screen -->
<div id="cover">
  <p class="eyebrow">You are invited</p>
  <div class="seal" id="monogram">E&amp;J</div>
  <p class="names-sm" id="coverNames"></p>
  <p style="color:var(--muted);font-style:italic;margin:6px 0 34px" id="coverDate"></p>
  <button class="btn solid" id="openBtn">Open invitation</button>
</div>

<button id="music" aria-label="Play or pause music"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></button>
<audio id="audio" loop preload="none"></audio>

<!-- Hero -->
<section id="hero">
  <div class="frame"></div>
<svg class="orn deco-t" viewBox="0 0 300 60" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2">
<path d="M0 30 H110 M190 30 H300"/><path d="M150 8 L172 30 L150 52 L128 30Z"/><path d="M150 18 L162 30 L150 42 L138 30Z"/>
<path d="M110 30 L128 30 M172 30 L190 30"/><circle cx="150" cy="30" r="2.5" fill="currentColor"/></g></svg>
  <div class="wrap">
    <p class="eyebrow fade" data-k="intro"></p>
    <h1 class="hero-names fade"><span data-k="bride"></span><span class="amp">&amp;</span><span data-k="groom"></span></h1>
    <p class="hero-date fade" data-k="dateText"></p>
    <p class="hero-city fade" data-k="city"></p>
  </div>
  <div class="scroll">Scroll</div>
</section>

<!-- Countdown -->
<section id="countdown">
  <div class="wrap fade">
    <p class="eyebrow">Counting down</p>
    <h2>Until we say I do</h2>
    <div class="count">
      <div><b id="cd-d">0</b><span>Days</span></div>
      <div><b id="cd-h">0</b><span>Hours</span></div>
      <div><b id="cd-m">0</b><span>Minutes</span></div>
      <div><b id="cd-s">0</b><span>Seconds</span></div>
    </div>
  </div>
</section>

<!-- Story -->
<section id="story">
  <div class="wrap fade">
    <div class="story-img" id="storyImg"></div>
    <p class="eyebrow">Our story</p>
    <h2>How it began</h2>
    <p class="story-text" data-k="story"></p>
  </div>
</section>

<!-- Details -->
<section id="details">
  <div class="wrap fade">
    <p class="eyebrow">The celebration</p>
    <h2>Where &amp; when</h2>
    <div class="cards" id="cards"></div>
  </div>
</section>

<!-- Schedule -->
<section id="schedule">
  <div class="wrap fade">
    <p class="eyebrow">The day</p>
    <h2>Schedule</h2>
    <div class="timeline" id="timeline"></div>
  </div>
</section>

<!-- Dress code -->
<section id="dress">
  <div class="wrap fade">
    <p class="eyebrow">Attire</p>
    <h2>Dress code</h2>
    <p class="story-text" data-k="dressCode"></p>
    <div class="swatches" id="swatches"></div>
  </div>
</section>

<!-- Gallery -->
<section id="gallery">
  <div class="wrap fade">
    <p class="eyebrow">Moments</p>
    <h2>Us, so far</h2>
    <div class="grid" id="grid"></div>
  </div>
</section>

<!-- RSVP -->
<section id="rsvp">
  <div class="wrap fade">
    <p class="eyebrow">Kindly reply by <span data-k="rsvpDeadline"></span></p>
    <h2>Will you join us?</h2>
    <form id="rsvpForm">
      <div><label for="f-name">Full name</label><input id="f-name" name="name" required autocomplete="name"></div>
      <div><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email"></div>
      <div>
        <label>Attendance</label>
        <div class="choice">
          <input type="radio" name="attending" id="a-yes" value="Yes" required><label for="a-yes">Joyfully accept</label>
          <input type="radio" name="attending" id="a-no" value="No"><label for="a-no">Regretfully decline</label>
        </div>
      </div>
      <div class="yes-only"><label for="f-guests">Number of guests</label><select id="f-guests" name="guests"></select></div>
      <div class="yes-only"><label for="f-meal">Meal preference</label><select id="f-meal" name="meal"></select></div>
      <div><label for="f-msg">Message for the couple</label><textarea id="f-msg" name="message" rows="3"></textarea></div>
      <button class="btn solid" type="submit" id="sendBtn">Send reply</button>
    </form>
    <div class="thanks hide" id="thanks">
      <h3>Thank you!</h3>
      <p class="story-text" id="thanksText"></p>
    </div>
  </div>
</section>

<footer>
  <div class="divider"></div>
  <p class="hero-names"><span data-k="bride"></span> &amp; <span data-k="groom"></span></p>
  <p class="tag" data-k="hashtag"></p>
</footer>

<script>
(function(){
  const C = CONFIG, $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // simple text fields
  document.querySelectorAll("[data-k]").forEach(el => { el.textContent = C[el.dataset.k] ?? ""; });
  document.title = `${C.bride} & ${C.groom} — Wedding Invitation`;
  $("#monogram").textContent = `${C.bride[0]}&${C.groom[0]}`;
  $("#coverNames").textContent = `${C.bride} & ${C.groom}`;
  $("#coverDate").textContent = C.dateText;

  // photo with elegant placeholder if the file is missing
  const photo = (src) => {
    const box = document.createElement("div"); box.className = "ph"; box.textContent = `${C.bride[0]}&${C.groom[0]}`;
    if (!src) return box;
    const img = new Image(); img.alt = ""; img.loading = "lazy"; img.src = src;
    img.onerror = () => img.replaceWith(box);
    return img;
  };
  $("#storyImg").appendChild(photo(C.photos[0]));
  C.photos.slice(1).forEach(p => { const g = document.createElement("div"); g.className = "g"; g.appendChild(photo(p)); $("#grid").appendChild(g); });
  if (C.photos.length < 2) $("#gallery").remove();

  // details cards
  [C.ceremony, C.reception].filter(Boolean).forEach(ev => {
    const map = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(ev.place + ", " + ev.address);
    $("#cards").insertAdjacentHTML("beforeend",
      `<div class="card"><h3>${esc(ev.title)}</h3><p class="time">${esc(ev.time)}</p><p class="place">${esc(ev.place)}</p><p class="addr">${esc(ev.address)}</p><a class="btn" href="${map}" target="_blank" rel="noopener">Open map</a></div>`);
  });

  // schedule + palette
  C.schedule.forEach(([t, e]) => $("#timeline").insertAdjacentHTML("beforeend", `<div class="tl"><span class="t">${esc(t)}</span><span class="e">${esc(e)}</span></div>`));
  C.palette.forEach(c => { const i = document.createElement("i"); i.style.background = c; $("#swatches").appendChild(i); });

  // RSVP selects
  for (let n = 1; n <= C.maxGuests; n++) $("#f-guests").insertAdjacentHTML("beforeend", `<option>${n}</option>`);
  C.meals.forEach(m => $("#f-meal").insertAdjacentHTML("beforeend", `<option>${esc(m)}</option>`));
  document.querySelectorAll('input[name="attending"]').forEach(r => r.addEventListener("change", () => {
    const no = $("#a-no").checked;
    document.querySelectorAll(".yes-only").forEach(el => el.classList.toggle("hide", no));
  }));

  // countdown
  const target = new Date(C.dateISO).getTime();
  const tick = () => {
    let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
    $("#cd-d").textContent = Math.floor(s / 86400); s %= 86400;
    $("#cd-h").textContent = String(Math.floor(s / 3600)).padStart(2, "0"); s %= 3600;
    $("#cd-m").textContent = String(Math.floor(s / 60)).padStart(2, "0");
    $("#cd-s").textContent = String(s % 60).padStart(2, "0");
  };
  tick(); setInterval(tick, 1000);

  // open invitation + music
  const audio = $("#audio"), mBtn = $("#music");
  if (C.music) audio.src = C.music;
  const setPlaying = on => mBtn.classList.toggle("playing", on);
  $("#openBtn").addEventListener("click", () => {
    $("#cover").classList.add("gone");
    document.body.classList.remove("locked");
    if (C.music) { mBtn.style.display = "flex"; audio.play().then(() => setPlaying(true)).catch(() => {}); }
  });
  if (/[?&]open\b/.test(location.search)) { $("#cover").classList.add("gone"); document.body.classList.remove("locked"); }
  mBtn.addEventListener("click", () => {
    if (audio.paused) audio.play().then(() => setPlaying(true)).catch(() => {});
    else { audio.pause(); setPlaying(false); }
  });
  audio.addEventListener("error", () => { mBtn.style.display = "none"; });

  // reveal on scroll
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15 });
  document.querySelectorAll(".fade").forEach(el => io.observe(el));

  // RSVP submit -> Google Sheet
  $("#rsvpForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target), btn = $("#sendBtn");
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      if (C.rsvpUrl) await fetch(C.rsvpUrl, { method: "POST", mode: "no-cors", body: fd });
      const yes = fd.get("attending") === "Yes";
      $("#thanksText").textContent = yes ? `We can't wait to celebrate with you, ${fd.get("name")}!` : `We'll miss you, ${fd.get("name")}. Thank you for letting us know.`;
      ev.target.classList.add("hide"); $("#thanks").classList.remove("hide");
    } catch (e) {
      btn.disabled = false; btn.textContent = "Send reply";
      alert("Sorry, something went wrong. Please try again.");
    }
  });
})();
</script>
<script>/* hide music controls when the song file is missing */
(function(){var a=document.getElementById('audio');if(!a||!a.getAttribute('src'))return;var p=new Audio();p.preload='metadata';
p.onerror=function(){['music','mbtn','np'].forEach(function(id){var e=document.getElementById(id);if(e)e.style.setProperty('display','none','important');});};p.src=a.getAttribute('src');})();</script>
</body>
</html>
