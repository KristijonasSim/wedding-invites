<style>
  :root{--bg:#fbf8f1;--card:#fff;--ink:#183a63;--muted:#5f7390;--tile:#1f4f8f;--tile2:#e9b949;--lemon:#f3cf3e;--leaf:#4f7a3a;--accent:#1f4f8f;--sea:#3f86b8;--btn-ink:#fff;
    --deco:"Italiana",serif;--serif:"Cormorant",Georgia,serif;--script:"Allura",cursive;--sans:"Montserrat",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;overflow-x:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body.locked{overflow:hidden}
  .wrap{max-width:640px;margin:0 auto;padding:0 22px;position:relative}
  .rv{opacity:0;transform:translateY(22px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
  .hide{display:none!important}
  .small{font-family:var(--sans);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--tile)}
  .strip{height:56px;width:100%;display:block}

  /* ===== INTRO: tiles flip away ===== */
  #intro{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:calc(100vw / 6);perspective:900px;overflow:hidden;cursor:pointer;transition:visibility 2.4s}
  #intro.gone{visibility:hidden;pointer-events:none}
  @media(min-width:600px){#intro{grid-template-columns:repeat(10,1fr);grid-auto-rows:10vw}}
  #intro .t{transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,0,.4,1),opacity .5s ease;transition-delay:calc(var(--d) * 1s);background:var(--card);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
  #intro .t svg{width:100%;height:100%;display:block}
  #intro.open .t{transform:rotateY(180deg) scale(.6);opacity:0}
  .plate{position:fixed;left:50%;top:50%;width:min(66vw,280px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:51;border-radius:50%;background:var(--card);
    box-shadow:0 20px 50px rgba(0,0,0,.25),0 0 0 8px var(--card),0 0 0 10px var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:transform 1s cubic-bezier(.6,0,.3,1),opacity .8s}
  .plate::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1.5px solid var(--tile2)}
  .plate .lem{width:70px;height:46px;margin-bottom:4px}
  .plate .nm{font-family:var(--script);font-size:clamp(40px,11vw,50px);line-height:1}
  .plate .tap{font-family:var(--sans);font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:10px;animation:blink 2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  body.revealed .plate,#intro.open ~ .plate{transform:translate(-50%,-50%) scale(0) rotate(-120deg);opacity:0;pointer-events:none}

  /* ===== PAGE ===== */
  .hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-start;text-align:center;overflow:hidden;padding:0 0 40px}
  .view{position:relative;height:50svh;min-height:300px;background:linear-gradient(180deg,color-mix(in srgb,var(--sea) 35%,#fff) 0%,#fff 55%,var(--sea) 55.5%,color-mix(in srgb,var(--sea) 70%,#000) 100%);overflow:hidden;
    -webkit-mask:radial-gradient(120% 128% at 50% 100%,#000 70%,transparent 70.5%);mask:radial-gradient(120% 128% at 50% 100%,#000 70%,transparent 70.5%)}
  .view .sun{position:absolute;left:62%;top:22%;width:70px;height:70px;border-radius:50%;background:var(--tile2);opacity:.85;box-shadow:0 0 60px var(--tile2)}
  .view .town{position:absolute;left:0;right:0;bottom:44%;height:40%;width:100%}
  .view .ph{position:absolute;inset:0;background-size:cover;background-position:center 40%}
  .branch{position:absolute;width:min(56vw,260px);pointer-events:none;z-index:2}
  .branch.l{left:-30px;top:calc(50svh - 90px);transform:rotate(-8deg)}.branch.r{right:-24px;top:-6px;transform:scaleX(-1) rotate(-14deg)}

  .arch .ph{aspect-ratio:3/4;border-radius:999px 999px 4px 4px;background-size:cover;background-position:center}
  .arch .lem{position:absolute;width:120px;right:-34px;bottom:-26px;transform:rotate(-12deg)}
  .story{max-width:440px;margin:32px auto 0;font-style:italic;color:var(--muted)}

  .cd{display:flex;justify-content:center;gap:10px}
  .cd div{width:78px;aspect-ratio:1;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.06)}
  .cd div::before{content:"";position:absolute;inset:5px;border:1.5px solid var(--tile)}
  .cd div::after{content:"";position:absolute;inset:9px;border:1px solid var(--tile2)}
  .cd b{font-family:var(--deco);font-weight:400;font-size:32px;line-height:1}
  .cd span{font-family:var(--sans);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

  .evs{display:grid;gap:22px}
  .ev{background:var(--card);padding:38px 24px 30px;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.07)}
  .ev .c{position:absolute;width:44px;height:44px}
  .ev .c.a{left:0;top:0}.ev .c.b{right:0;top:0;transform:scaleX(-1)}.ev .c.c2{left:0;bottom:0;transform:scaleY(-1)}.ev .c.d{right:0;bottom:0;transform:scale(-1)}
  .ev h3{font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--tile)}
  .ev .t{font-family:var(--deco);font-size:34px;line-height:1.1;margin:6px 0 0}
  .ev .p{font-family:var(--script);font-size:38px;line-height:1.1;color:var(--ink)}
  .ev .a{color:var(--muted);font-size:16px;margin:4px 0 16px}
  .btn{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;padding:13px 26px;border:1.5px solid var(--accent);color:var(--accent);background:none;text-decoration:none;cursor:pointer}
  .btn.solid{background:var(--accent);color:var(--btn-ink)}

  .sched{max-width:420px;margin:0 auto}
  .sched div{display:grid;grid-template-columns:96px 22px 1fr;align-items:center;gap:12px;padding:12px 0;text-align:left;border-bottom:1px dashed color-mix(in srgb,var(--tile) 30%,transparent)}
  .sched b{font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.14em;color:var(--tile);text-align:right}
  .sched i{width:14px;height:14px;background:var(--lemon);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;transform:rotate(30deg);box-shadow:inset -2px -2px 0 rgba(0,0,0,.1)}
  .sched span{font-size:22px}

  .info{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:540px){.info{grid-template-columns:1fr}}
  .info div{background:var(--card);padding:28px 20px;border-top:6px solid var(--tile);box-shadow:0 18px 40px rgba(0,0,0,.06)}
  .info h4{font-family:var(--deco);font-weight:400;font-size:26px;margin:4px 0}
  .info p{color:var(--muted);font-size:17px}

  .card{background:var(--card);padding:42px 24px 32px;position:relative;text-align:left;box-shadow:0 24px 50px rgba(0,0,0,.1)}
  .card .border{position:absolute;inset:8px;border:1.5px solid var(--tile);pointer-events:none}
  form{display:grid;gap:16px;position:relative}
  .lbl{font-family:var(--sans);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  input,select,textarea{width:100%;font:inherit;font-size:19px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid color-mix(in srgb,var(--tile) 35%,transparent);padding:7px 2px;border-radius:0;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--tile)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .two input{position:absolute;opacity:0;pointer-events:none}
  .two label{border:1.5px solid var(--tile);text-align:center;padding:12px 6px;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--tile)}
  .two input:checked+label{background:var(--tile);color:#fff}
  #thx{font-size:24px;font-style:italic;text-align:center}
  footer{padding:40px 0 90px;text-align:center}
  footer .lem{width:120px;height:80px}
  footer .script{font-family:var(--script);font-size:54px;line-height:1}
  #music{position:fixed;right:14px;bottom:14px;z-index:40;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--tile);background:var(--card);display:none;align-items:center;justify-content:center;cursor:pointer}
  #music svg{width:18px;fill:var(--tile)}#music.on svg{animation:sp 4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* ===== THEME ===== */
:root{--bg:#f5f8fc;--card:#ffffff;--ink:#12305a;--muted:#5b6f8c;--tile:#16469b;--tile2:#6aa7dc;--lemon:#f1d24a;--leaf:#4f7a3a;--accent:#16469b;--sea:#2f78c4;--btn-ink:#fff}

      <path d="M40 14c6 8 6 14 0 20-6-6-6-12 0-20zM40 66c-6-8-6-14 0-20 6 6 6 12 0 20zM14 40c8-6 14-6 20 0-6 6-12 6-20 0zM66 40c-8 6-14 6-20 0 6-6 12-6 20 0z"/></g>

<script>
(function(){
  const g = document.getElementById("intro"), cols = innerWidth >= 600 ? 10 : 6, size = innerWidth / cols, rows = Math.ceil(innerHeight / size) + 1;
  const cx = (cols - 1) / 2, cy = (rows - 1) / 2, maxd = Math.hypot(cx, cy); let h = "";
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) h += `<div class="t" style="--d:${(Math.hypot(c - cx, r - cy) / maxd * .9).toFixed(2)}"><svg><use href="#tileArt"/></svg></div>`;
  g.innerHTML = h;
})();
const CORNERS = `<svg class="c a"><use href="#corner"/></svg><svg class="c b"><use href="#corner"/></svg><svg class="c c2"><use href="#corner"/></svg><svg class="c d"><use href="#corner"/></svg>`;
window.EVT = (t, time, p, a, map) => `<div class="ev rv">${CORNERS}<h3>${t}</h3><p class="t">${time}</p><p class="p">${p}</p><p class="a">${a}</p><a class="btn" href="${map}" target="_blank" rel="noopener">Directions</a></div>`;
window.SCHED = (t, e) => `<div><b>${t}</b><i></i><span>${e}</span></div>`;
window.onOpen = () => document.querySelector(".plate").style.cssText = "transform:translate(-50%,-50%) scale(0) rotate(-120deg);opacity:0;pointer-events:none";
window.onRevealed = () => { const p = document.querySelector(".plate"); p.style.display = "none"; };
/* Shared logic for designs 8-15. Inlined into every invitation at build time. */
(function(){
  const C = CONFIG, $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const L = C.locale || "en-US", d = new Date(C.dateISO), pad = n => String(n).padStart(2, "0");
  const mono = C.bride[0] + (C.groom ? C.groom[0] : "");
  const fmt = {
    weekday: { weekday: "long" }, day: { day: "numeric" }, month: { month: "long" }, mon: { month: "short" }, year: { year: "numeric" },
    long: { weekday: "long", month: "long", day: "numeric", year: "numeric" }, short: { month: "long", day: "numeric", year: "numeric" },
    num: null, time: { hour: "numeric", minute: "2-digit" }
  };
  window.W = { C, $, $$, esc, d, pad, mono, map: (p, a) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p + ", " + a) };

  document.title = `${C.bride} & ${C.groom} — ${C.titleWord || "Wedding Invitation"}`;
  $$("[data-k]").forEach(el => el.textContent = C[el.dataset.k] ?? "");
  $$("[data-names]").forEach(el => el.textContent = C.groom ? `${C.bride} ${el.dataset.names || "&"} ${C.groom}` : C.bride);
  $$("[data-mono]").forEach(el => el.textContent = el.dataset.mono && C.groom ? C.bride[0] + el.dataset.mono + C.groom[0] : mono);
  $$("[data-date]").forEach(el => {
    const k = el.dataset.date;
    el.textContent = k === "num" ? `${pad(d.getMonth() + 1)}.${pad(d.getDate())}.${String(d.getFullYear()).slice(2)}` : d.toLocaleString(L, fmt[k]);
    if (el.dataset.upper != null) el.textContent = el.textContent.toUpperCase();
  });
  $$("[data-photo]").forEach(el => {
    const src = C.photos[el.dataset.photo]; if (!src) return;
    if (el.tagName === "IMG") el.src = src; else el.style.backgroundImage = `url("${src}")`;
  });

  const evTpl = window.EVT || ((t, time, p, a, map) => `<div class="ev rv"><h3>${t}</h3><p class="t">${time}</p><p class="p">${p}</p><p class="a">${a}</p><a class="btn" href="${map}" target="_blank" rel="noopener">${C.mapWord || "View map"}</a></div>`);
  if ($("#evs")) C.events.forEach(([t, time, p, a], i) => $("#evs").insertAdjacentHTML("beforeend", evTpl(esc(t), esc(time), esc(p), esc(a), W.map(p, a), i)));
  const scTpl = window.SCHED || ((t, e) => `<div><span>${t}</span><span>${e}</span></div>`);
  if ($("#sched")) C.schedule.forEach(([t, e], i) => $("#sched").insertAdjacentHTML("beforeend", scTpl(esc(t), esc(e), i)));
  if ($("#guests")) $("#guests").innerHTML = Array.from({ length: C.maxGuests }, (_, i) => `<option>${i + 1}</option>`).join("");
  if ($("#meal")) $("#meal").innerHTML = C.meals.map(m => `<option>${esc(m)}</option>`).join("");
  $$('input[name="attending"]').forEach(r => r.onchange = () => $$(".yes").forEach(el => el.classList.toggle("hide", r.value === "No" && r.checked)));

  const cd = { d: $$('[data-cd="d"]'), h: $$('[data-cd="h"]'), m: $$('[data-cd="m"]'), s: $$('[data-cd="s"]') };
  const tick = () => { let s = Math.max(0, Math.floor((d - Date.now()) / 1000));
    const v = { d: Math.floor(s / 86400), h: pad(Math.floor(s % 86400 / 3600)), m: pad(Math.floor(s % 3600 / 60)), s: pad(s % 60) };
    for (const k in cd) cd[k].forEach(el => el.textContent = v[k]); };
  tick(); setInterval(tick, 1000);

  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
  $$(".rv").forEach(el => io.observe(el));

  const audio = $("#audio"), mb = $("#music"); if (C.music) audio.src = C.music;
  audio.onerror = () => mb.style.display = "none";
  audio.onplay = () => mb.classList.add("on"); audio.onpause = () => mb.classList.remove("on");
  mb.onclick = () => audio.paused ? audio.play().catch(() => {}) : audio.pause();
  const intro = $("#intro"), ms = +(intro && intro.dataset.ms || 3000);
  const finish = () => { if (!intro) return; intro.classList.add("gone"); document.body.classList.remove("locked"); document.body.classList.add("revealed"); window.onRevealed && window.onRevealed(); };
  const open = () => { if (!intro || intro.classList.contains("open")) return; intro.classList.add("open"); window.onOpen && window.onOpen();
    if (C.music) { mb.style.display = "flex"; audio.play().catch(() => {}); } setTimeout(finish, ms); };
  $$("[data-open]").forEach(el => el.addEventListener("click", open));
  $$("[data-skip]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); finish(); }));
  if (/[?&]open\b/.test(location.search)) { intro && intro.classList.add("open"); finish(); }
  if (/[?&]autoopen\b/.test(location.search)) setTimeout(open, 600);

  const f = $("#f");
  if (f) f.onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(f), btn = $("#send"); btn.disabled = true; btn.textContent = C.sendingWord || "Sending…";
    try { if (C.rsvpUrl) await fetch(C.rsvpUrl, { method: "POST", mode: "no-cors", body: fd }); } catch (_) {}
    const yes = fd.get("attending") === "Yes", n = esc(fd.get("name"));
    $("#thx").innerHTML = (yes ? (C.thanksYes || "Thank you, {n}! We can't wait to celebrate with you.") : (C.thanksNo || "Thank you, {n}. You will be missed.")).replace("{n}", n);
    f.classList.add("hide"); $("#thx").classList.remove("hide");
  };
})();

</script>
<script>/* hide music controls when the song file is missing */
(function(){var a=document.getElementById('audio');if(!a||!a.getAttribute('src'))return;var p=new Audio();p.preload='metadata';
p.onerror=function(){var e=document.getElementById('music');if(e)e.style.setProperty('display','none','important');};p.src=a.getAttribute('src');})();</script>
</body>
</html>
