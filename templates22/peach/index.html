<style>
  :root{--bg:#fdf8f6;--card:#fff;--ink:#4a3437;--muted:#9a8285;--accent:#c47f86;--f1:#eab4b8;--f2:#f6d3c4;--f3:#d98f99;--leaf:#8fa58a;--leaf2:#b9c9b0;--btn-ink:#fff;
    --script:"Parisienne",cursive;--serif:"EB Garamond",Georgia,serif;--sans:"Raleway",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;overflow-x:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body.locked{overflow:hidden}
  .wrap{max-width:620px;margin:0 auto;padding:0 24px;position:relative}
  .rv{opacity:0;transform:translateY(22px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
  .hide{display:none!important}
  .small{font-family:var(--sans);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
  .script{font-family:var(--script);font-weight:400;line-height:1.1}
  .fl-g{filter:url(#soft)}
  .grow{transform-box:fill-box;transform-origin:center;animation:bloom 1.1s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i) * .07s + .2s)}
  @keyframes bloom{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

  /* ===== INTRO: blooming wreath ===== */
  #intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 1s ease .6s,visibility 1.8s;overflow:hidden}
  #intro.gone{opacity:0;visibility:hidden}
  .wreath{position:relative;width:min(88vw,400px);aspect-ratio:1;cursor:pointer;transition:transform 1.6s cubic-bezier(.6,0,.3,1)}
  .wreath svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .wreath .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;animation:fade 1.2s ease 1.9s forwards}
  .wreath .mid .script{font-size:clamp(40px,11vw,54px)}
  @keyframes fade{to{opacity:1}}
  .tapnote{margin-top:22px;font-family:var(--sans);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);opacity:0;animation:fade 1s ease 2.4s forwards,blink 2.2s ease-in-out 3.4s infinite}
  @keyframes blink{50%{opacity:.35}}
  #intro.open .wreath{transform:scale(2.6) rotate(25deg)}
  #intro.open .mid,#intro.open .tapnote{animation:none;opacity:0;transition:opacity .5s}

  /* falling petals */
  .petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .petals i{position:absolute;top:-30px;width:14px;height:11px;border-radius:70% 0 70% 0;background:var(--f1);opacity:.75;animation:fall linear infinite}
  @keyframes fall{to{transform:translate3d(60px,110vh,0) rotate(540deg)}}

  /* ===== PAGE ===== */
  .hero{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:90px 0;overflow:hidden}
  .corner{position:absolute;width:min(78vw,380px);pointer-events:none}
  .corner.tl{left:-40px;top:-30px}.corner.br{right:-40px;bottom:-30px;transform:rotate(180deg)}
  .hero h1{font-family:var(--script);font-weight:400;font-size:clamp(64px,18vw,104px);line-height:1;margin:10px 0}
  .hero h1 em{display:block;font-family:var(--serif);font-size:.3em;color:var(--accent);margin:2px 0}
  .hero .intro{font-style:italic;color:var(--muted);max-width:400px;margin:0 auto}
  .hero .date{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:22px;font-family:var(--sans);font-size:12px;letter-spacing:.24em;text-transform:uppercase}
  .hero .date b{font-family:var(--serif);font-weight:400;font-size:52px;letter-spacing:0;line-height:1;color:var(--accent)}
  .hero .date span{border-top:1px solid var(--f1);border-bottom:1px solid var(--f1);padding:6px 4px;min-width:96px}
  section{padding:80px 0;text-align:center;position:relative;overflow:hidden}
  h2{font-family:var(--script);font-weight:400;font-size:clamp(44px,12vw,60px);line-height:1;margin:6px 0 24px}
  .sprig{display:block;width:120px;height:40px;margin:0 auto 6px;overflow:visible}

  .arch{position:relative;width:min(320px,78vw);margin:0 auto}
  .arch .ph{aspect-ratio:3/4;border-radius:999px 999px 14px 14px;background-size:cover;background-position:center;box-shadow:0 20px 40px rgba(80,40,40,.12)}
  .arch svg{position:absolute;width:62%;left:-22%;bottom:-12%;overflow:visible}
  .arch svg.b{left:auto;right:-20%;top:-8%;bottom:auto;width:48%;transform:rotate(160deg)}
  .story{max-width:430px;margin:40px auto 0;font-style:italic;color:var(--muted)}

  .cd{display:flex;justify-content:center;gap:clamp(10px,4vw,26px)}
  .cd div{width:78px;padding:16px 0;border-radius:40px 40px 10px 10px;background:color-mix(in srgb,var(--f2) 45%,var(--card))}
  .cd b{display:block;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1}
  .cd span{font-family:var(--sans);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

  .evs{display:grid;gap:20px}
  .ev{background:var(--card);border-radius:22px;padding:34px 24px 30px;box-shadow:0 16px 36px rgba(80,40,40,.06);position:relative;overflow:hidden}
  .ev::before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:var(--f2);opacity:.35;right:-50px;top:-60px;filter:url(#soft)}
  .ev h3{font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);position:relative}
  .ev .t{font-size:30px;margin:2px 0;position:relative}
  .ev .p{font-family:var(--script);font-size:34px;line-height:1.1;position:relative}
  .ev .a{color:var(--muted);font-size:16px;margin:2px 0 16px;position:relative}
  .btn{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;padding:13px 26px;border:1px solid var(--accent);color:var(--ink);background:none;text-decoration:none;cursor:pointer;border-radius:99px;position:relative}
  .btn.solid{background:var(--accent);color:var(--btn-ink)}

  .sched{max-width:400px;margin:0 auto}
  .sched div{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--f1) 55%,transparent);text-align:left}
  .sched svg{width:26px;height:26px;flex:none;overflow:visible}
  .sched b{font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:.16em;color:var(--accent);width:78px;flex:none}
  .sched span{font-size:21px}

  .info{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:540px){.info{grid-template-columns:1fr}}
  .info div{background:var(--card);border-radius:22px;padding:28px 20px;box-shadow:0 16px 36px rgba(80,40,40,.05)}
  .info h4{font-family:var(--script);font-weight:400;font-size:34px;line-height:1.1}
  .info p{color:var(--muted);font-size:17px}

  .card{background:var(--card);border-radius:26px;padding:40px 24px 34px;box-shadow:0 24px 50px rgba(80,40,40,.09);text-align:left;position:relative}
  form{display:grid;gap:16px}
  .lbl{font-family:var(--sans);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  input,select,textarea{width:100%;font:inherit;font-size:19px;color:var(--ink);background:color-mix(in srgb,var(--f2) 20%,var(--card));border:1px solid color-mix(in srgb,var(--f1) 60%,transparent);border-radius:14px;padding:10px 14px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .two input{position:absolute;opacity:0;pointer-events:none}
  .two label{border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);border-radius:99px;text-align:center;padding:12px 6px;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  .two input:checked+label{background:var(--accent);color:var(--btn-ink);border-color:var(--accent)}
  #thx{font-size:24px;font-style:italic;text-align:center}
  footer{padding:30px 0 90px;text-align:center;position:relative}
  footer .script{font-size:52px;margin-bottom:10px}
  #music{position:fixed;right:14px;bottom:14px;z-index:40;width:46px;height:46px;border-radius:50%;border:1px solid var(--accent);background:var(--card);display:none;align-items:center;justify-content:center;cursor:pointer}
  #music svg{width:18px;fill:var(--accent)}#music.on svg{animation:sp 4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* ===== THEME ===== */
:root{--bg:#fdf7f2;--card:#fffdfb;--ink:#4a3328;--muted:#9a8174;--accent:#d0845c;--f1:#f5c3a5;--f2:#fbe0c8;--f3:#e7976d;--leaf:#8ea27f;--leaf2:#c0cdb0;--btn-ink:#fff}
</style>

<svg width="0" height="0" style="position:absolute">
  <defs><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="4"/><feGaussianBlur stdDeviation=".45"/></filter></defs>
  <symbol id="rose" viewBox="-30 -30 60 60" overflow="visible"><g class="fl-g">
    <circle r="26" fill="var(--f1)" opacity=".55"/><circle r="20" cx="2" cy="-1" fill="var(--f1)" opacity=".7"/>
    <path d="M-14 4 C-16 -12 6 -18 14 -6 C18 4 8 14 -2 12" fill="none" stroke="var(--f3)" stroke-width="3" opacity=".55"/>

    <use href="#leaf" x="150" y="40" width="60" height="60" transform="rotate(30 180 70)"/><use href="#leaf" x="40" y="130" width="60" height="60" transform="rotate(-60 70 160)"/>
    <use href="#leaf" x="120" y="150" width="70" height="70" transform="rotate(120 155 185)"/><use href="#leaf" x="200" y="110" width="50" height="50" transform="rotate(70 225 135)"/>
    <use href="#bud" x="210" y="20" width="60" height="60"/><use href="#bud" x="20" y="190" width="56" height="56" transform="rotate(-80 48 218)"/>
    <use href="#rose" x="60" y="40" width="110" height="110"/><use href="#bloom" x="140" y="90" width="80" height="80"/><use href="#rose" x="110" y="130" width="60" height="60"/>

    <use href="#leaf" x="20" y="8" width="22" height="22" transform="rotate(-70 31 19)"/><use href="#leaf" x="78" y="8" width="22" height="22" transform="rotate(70 89 19)"/>
    <use href="#rose" x="44" y="2" width="32" height="32"/></symbol>
</svg>

<div id="intro" data-ms="1500">
  <div class="petals" id="pt1"></div>
  <div class="wreath" id="openBtn" data-open>
    <svg viewBox="0 0 400 400" id="wreath"></svg>

</div>

  <header class="hero">

  <section><div class="wrap">

  <section><div class="wrap">

<script>
(function(){
  // wreath: leaves and flowers placed around a circle, each one blooms in turn
  const w = document.getElementById("wreath"), kinds = ["leaf","leaf","bud","leaf","rose","leaf","bloom","leaf","leaf","bud","leaf","rose","leaf","bloom"];
  let h = "", n = 34;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 - Math.PI / 2, k = kinds[i % kinds.length], r = 158 + (i % 2 ? 8 : -6);
    const s = k === "rose" ? 86 : k === "bloom" ? 66 : k === "bud" ? 56 : 54, x = 200 + Math.cos(a) * r, y = 200 + Math.sin(a) * r;
    const rot = a * 180 / Math.PI + (k === "leaf" ? (i % 2 ? 30 : 150) : 0);
    h += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)})"><use class="grow" style="--i:${i}" href="#${k}" x="${-s/2}" y="${-s/2}" width="${s}" height="${s}"/></g>`;
  }
  w.innerHTML = h;
  const petals = el => { let p = ""; for (let i = 0; i < 14; i++) p += `<i style="left:${(i * 37) % 100}%;animation-duration:${9 + (i * 7) % 8}s;animation-delay:-${(i * 3.1) % 12}s;transform:scale(${.6 + (i % 4) * .2})"></i>`; el.innerHTML = p; };
  petals(document.getElementById("pt1")); petals(document.getElementById("pt2"));
})();
window.EVT = (t, time, p, a, map) => `<div class="ev rv"><h3>${t}</h3><p class="t">${time}</p><p class="p">${p}</p><p class="a">${a}</p><a class="btn" href="${map}" target="_blank" rel="noopener">Directions</a></div>`;
window.SCHED = (t, e, i) => `<div><svg viewBox="0 0 60 60"><use href="#${i % 2 ? "bloom" : "rose"}" x="0" y="0" width="60" height="60"/></svg><b>${t}</b><span>${e}</span></div>`;
/* Shared logic for designs 8-15. Inlined into every invitation at build time. */
(function(){
  const C = CONFIG, $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const L = C.locale || "en-US", d = new Date(C.dateISO), pad = n => String(n).padStart(2, "0");
  const mono = C.bride[0] + (C.groom ? C.groom[0] : "");
  const fmt = {
    weekday: { weekday: "long" }, day: { day: "numeric" }, month: { month: "long" }, mon: { month: "short" }, year: { year: "numeric" },
    long: { weekday: "long", month: "long", day: "numeric", year: "numeric" }, short: { month: "long", day: "numeric", year: "numeric" },
    num: null, time: { hour: "numeric", minute: "2-digit" }
  };
  window.W = { C, $, $$, esc, d, pad, mono, map: (p, a) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p + ", " + a) };

  document.title = `${C.bride} & ${C.groom} — ${C.titleWord || "Wedding Invitation"}`;
  $$("[data-k]").forEach(el => el.textContent = C[el.dataset.k] ?? "");
  $$("[data-names]").forEach(el => el.textContent = C.groom ? `${C.bride} ${el.dataset.names || "&"} ${C.groom}` : C.bride);
  $$("[data-mono]").forEach(el => el.textContent = el.dataset.mono && C.groom ? C.bride[0] + el.dataset.mono + C.groom[0] : mono);
  $$("[data-date]").forEach(el => {
    const k = el.dataset.date;
    el.textContent = k === "num" ? `${pad(d.getMonth() + 1)}.${pad(d.getDate())}.${String(d.getFullYear()).slice(2)}` : d.toLocaleString(L, fmt[k]);
    if (el.dataset.upper != null) el.textContent = el.textContent.toUpperCase();
  });
  $$("[data-photo]").forEach(el => {
    const src = C.photos[el.dataset.photo]; if (!src) return;
    if (el.tagName === "IMG") el.src = src; else el.style.backgroundImage = `url("${src}")`;
  });

  const evTpl = window.EVT || ((t, time, p, a, map) => `<div class="ev rv"><h3>${t}</h3><p class="t">${time}</p><p class="p">${p}</p><p class="a">${a}</p><a class="btn" href="${map}" target="_blank" rel="noopener">${C.mapWord || "View map"}</a></div>`);
  if ($("#evs")) C.events.forEach(([t, time, p, a], i) => $("#evs").insertAdjacentHTML("beforeend", evTpl(esc(t), esc(time), esc(p), esc(a), W.map(p, a), i)));
  const scTpl = window.SCHED || ((t, e) => `<div><span>${t}</span><span>${e}</span></div>`);
  if ($("#sched")) C.schedule.forEach(([t, e], i) => $("#sched").insertAdjacentHTML("beforeend", scTpl(esc(t), esc(e), i)));
  if ($("#guests")) $("#guests").innerHTML = Array.from({ length: C.maxGuests }, (_, i) => `<option>${i + 1}</option>`).join("");
  if ($("#meal")) $("#meal").innerHTML = C.meals.map(m => `<option>${esc(m)}</option>`).join("");
  $$('input[name="attending"]').forEach(r => r.onchange = () => $$(".yes").forEach(el => el.classList.toggle("hide", r.value === "No" && r.checked)));

  const cd = { d: $$('[data-cd="d"]'), h: $$('[data-cd="h"]'), m: $$('[data-cd="m"]'), s: $$('[data-cd="s"]') };
  const tick = () => { let s = Math.max(0, Math.floor((d - Date.now()) / 1000));
    const v = { d: Math.floor(s / 86400), h: pad(Math.floor(s % 86400 / 3600)), m: pad(Math.floor(s % 3600 / 60)), s: pad(s % 60) };
    for (const k in cd) cd[k].forEach(el => el.textContent = v[k]); };
  tick(); setInterval(tick, 1000);

  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
  $$(".rv").forEach(el => io.observe(el));

  const audio = $("#audio"), mb = $("#music"); if (C.music) audio.src = C.music;
  audio.onerror = () => mb.style.display = "none";
  audio.onplay = () => mb.classList.add("on"); audio.onpause = () => mb.classList.remove("on");
  mb.onclick = () => audio.paused ? audio.play().catch(() => {}) : audio.pause();
  const intro = $("#intro"), ms = +(intro && intro.dataset.ms || 3000);
  const finish = () => { if (!intro) return; intro.classList.add("gone"); document.body.classList.remove("locked"); document.body.classList.add("revealed"); window.onRevealed && window.onRevealed(); };
  const open = () => { if (!intro || intro.classList.contains("open")) return; intro.classList.add("open"); window.onOpen && window.onOpen();
    if (C.music) { mb.style.display = "flex"; audio.play().catch(() => {}); } setTimeout(finish, ms); };
  $$("[data-open]").forEach(el => el.addEventListener("click", open));
  $$("[data-skip]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); finish(); }));
  if (/[?&]open\b/.test(location.search)) { intro && intro.classList.add("open"); finish(); }
  if (/[?&]autoopen\b/.test(location.search)) setTimeout(open, 600);

  const f = $("#f");
  if (f) f.onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(f), btn = $("#send"); btn.disabled = true; btn.textContent = C.sendingWord || "Sending…";
    try { if (C.rsvpUrl) await fetch(C.rsvpUrl, { method: "POST", mode: "no-cors", body: fd }); } catch (_) {}
    const yes = fd.get("attending") === "Yes", n = esc(fd.get("name"));
    $("#thx").innerHTML = (yes ? (C.thanksYes || "Thank you, {n}! We can't wait to celebrate with you.") : (C.thanksNo || "Thank you, {n}. You will be missed.")).replace("{n}", n);
    f.classList.add("hide"); $("#thx").classList.remove("hide");
  };
})();

</script>
<script>/* hide music controls when the song file is missing */
(function(){var a=document.getElementById('audio');if(!a||!a.getAttribute('src'))return;var p=new Audio();p.preload='metadata';
p.onerror=function(){var e=document.getElementById('music');if(e)e.style.setProperty('display','none','important');};p.src=a.getAttribute('src');})();</script>
</body>
</html>
